name: Build Android APK
# Trigger fresh signing-secret build after repository secret setup
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore permanent signing key
        env:
          LAUNCHER_KEYSTORE_BASE64: ${{ secrets.LAUNCHER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$LAUNCHER_KEYSTORE_BASE64" ]; then
            echo "::error::Missing LAUNCHER_KEYSTORE_BASE64 secret. Refusing to create an APK with a different signing key."
            exit 1
          fi
          mkdir -p ~/.android
          printf '%s' "$LAUNCHER_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null
      - name: Show signing certificate fingerprint
        run: keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep SHA256
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK signing
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          KEY_FP=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -1)
          APK_FP=$(keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | sed -n 's/.*SHA256: //p' | head -1)
          if [ -z "$KEY_FP" ] || [ "$KEY_FP" != "$APK_FP" ]; then
            echo "::error::APK signature differs from permanent keystore"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: MosaicLauncher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
